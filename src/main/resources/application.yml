spring:
  datasource:
    # Use the 'jdbc' prefix and ensure sslmode=require is present
    url: ${DB_URL}
    username: ${DB_USERNAME} # Use env variables for security
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate # Flyway handles the schema, Hibernate only validates

  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  cloudinary:
    resume-url: ${CLOUDINARY_URL}
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration: ${APP_JWT_EXPIRATION}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus # Added Prometheus for scraping
  endpoint:
    health:
      show-details: when-authorized # DB and Cloudinary details only visible to authorized users
      probes:
        enabled: true # Vital for Render's zero-downtime deployment
  health:
    db:
      enabled: false # Disabled: prevents SELECT 1 on every UptimeRobot ping (saves Neon free tier compute)
    cloudinary:
      enabled: false # Disabled: prevents HTTP call to Cloudinary on every ping
  metrics:
    tags:
      application: portfolio-backend
  info:
    env:
      enabled: true

logging:
  level:
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR