spring:
  datasource:
    # Adding DB_CLOSE_DELAY=-1 keeps the in-memory DB alive for the whole test suite
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  flyway:
    enabled: false # Disable Flyway for H2 tests to avoid syntax conflicts
  # ... existing datasource/jpa config ...
  mail:
    host: localhost
    port: 25
    username: test@example.com
    password: dummy
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  # Disable async in tests to make them deterministic and avoid thread leaks
  task:
    execution:
      pool:
        core-size: 1
management:
  health:
    mail:
      enabled: false # Prevents health check from failing due to dummy mail config
    db:
      enabled: true
# Test environment variables
MY_EMAIL: test@example.com
GMAIL_APP_PASSWORD: dummy
CLOUDINARY_URL: dummy
APP_JWT_SECRET: bXlTZWNyZXRLZXlGb3JUZXN0aW5nUHVycG9zZXNPbmx5
APP_JWT_EXPIRATION: 86400000
