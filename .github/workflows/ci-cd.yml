name: Java CI/CD with Gradle

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest # Fixed the typo here
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Test
        run: ./gradlew build

        env:
          JAVA_OPTS: "-Xmx512m"
          MY_EMAIL: test@example.com
          GMAIL_APP_PASSWORD: dummy
          CLOUDINARY_URL: dummy
          DB_URL: jdbc:h2:mem:testdb           # Add these
          DB_USERNAME: sa                       # Add these
          DB_PASSWORD: ""

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest # Fixed the typo here
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Render
        # This calls the URL you stored in GitHub Secrets
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}